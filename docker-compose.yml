version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taxla_postgres
    environment:
      POSTGRES_DB: taxla_db
      POSTGRES_USER: taxla_user
      POSTGRES_PASSWORD: taxla_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxla_user -d taxla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taxla_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: taxla_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # If the user has an NVIDIA GPU and wants to use it in docker, they would need:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
